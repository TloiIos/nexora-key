<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA — Portal Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css?v=10">
  <style>
    .auth-tabs { display: flex !important; flex-direction: column !important; }
    .auth-tab { width: 100% !important; }
  </style>
</head>
<body>

  <!-- Ambient Light Background -->
  <div class="auth-bg">
    <div class="auth-bg__orb auth-bg__orb--violet"></div>
    <div class="auth-bg__orb auth-bg__orb--cyan"></div>
  </div>
  <div class="auth-grid"></div>

  <!-- Auth Container -->
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-card__header">
        <div class="auth-card__logo">N</div>
        <div>
          <div class="auth-card__brand">NEXORA KEY</div>
          <div class="auth-card__sub">Management Authentication Portal</div>
        </div>
      </div>

      <!-- Auth Tabs: Login vs Register -->
      <div class="auth-tabs" style="display:flex; flex-direction:column; gap:4px;">
        <button class="auth-tab auth-tab--active" id="tabLoginBtn" type="button" style="width:100%;">Đăng Nhập</button>
        <button class="auth-tab" id="tabRegisterBtn" type="button" style="width:100%;">Đăng Ký Khách Hàng</button>
      </div>

      <!-- Login Form -->
      <form class="auth-form" id="loginForm">
        <div class="auth-field">
          <label class="auth-field__label" for="loginUser">Tên tài khoản / Username</label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input class="auth-input" type="text" id="loginUser" placeholder="Nhập tài khoản..." required autocomplete="username">
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-field__label" for="loginPw">Mật khẩu / Password</label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="auth-input" type="password" id="loginPw" placeholder="••••••••" required autocomplete="current-password">
            <button class="auth-toggle-pw" id="toggleLoginPw" type="button" title="Ẩn/Hiện mật khẩu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="auth-options">
          <label class="auth-checkbox">
            <input type="checkbox" id="rememberMe" checked>
            <span>Ghi nhớ đăng nhập</span>
          </label>
          <span class="auth-ssl-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            SSL 256-bit
          </span>
        </div>

        <div class="auth-error" id="loginError"></div>

        <button class="btn-auth btn-auth--primary" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
            Đăng Nhập
          </button>
          <div class="auth-note" style="margin-top:12px;color:#9ca3af;font-size:0.9rem;line-height:1.4;">
            Chú ý: chỉ tài khoản admin/admin123 mới vào được trang quản trị. Tài khoản khác là khách hàng.
          </div>
        </form>
      <!-- Register Form -->
      <form class="auth-form" id="registerForm" style="display:none;">
        <div class="auth-field">
          <label class="auth-field__label" for="regUser">Tên tài khoản mới</label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input class="auth-input" type="text" id="regUser" placeholder="Tạo tên đăng nhập..." required autocomplete="username">
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-field__label" for="regEmail">Email liên hệ</label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input class="auth-input" type="email" id="regEmail" placeholder="name@domain.com" required autocomplete="email">
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-field__label" for="regPw">Mật khẩu</label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="auth-input" type="password" id="regPw" placeholder="Tối thiểu 6 ký tự..." required autocomplete="new-password">
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-field__label" for="regConfirmPw">Xác nhận mật khẩu</label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            <input class="auth-input" type="password" id="regConfirmPw" placeholder="Nhập lại mật khẩu..." required autocomplete="new-password">
          </div>
        </div>

        <div class="auth-error" id="regError"></div>
        <div class="auth-success" id="regSuccess"></div>

        <button class="btn-auth btn-auth--secondary" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
          Đăng Ký Khách Hàng
        </button>
      </form>

      <div class="auth-card__footer">
        <a href="index.html" class="auth-card__link">&larr; Quay lại Trang Bán Hàng Client</a>
      </div>
    </div>
  </div>

  <div id="authToast"></div>
  <script src="js/login.js?v=9"></script>
</body>
</html>
